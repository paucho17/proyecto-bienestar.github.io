{% extends "base.html" %}
{% block content %}
<h1>Validación manual de asistencia</h1>
{% if messages %}
  <ul>{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Código QR / identificador único:</label>
  <input type="text" name="codigo_qr" required>
  <button type="submit">Validar asistencia</button>
</form>
{% endblock %}
